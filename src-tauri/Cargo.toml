[package]
name = "ma-tete"
version = "0.1.0"
description = "Ma Tête — capture rapide, panneau, post-it (Windows)"
authors = ["Loic"]
edition = "2021"

[lib]
name = "ma_tete_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
